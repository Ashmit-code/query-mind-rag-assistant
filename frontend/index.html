<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('querymind_theme');
          const preferredDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = stored === 'light' || stored === 'dark' ? stored : (preferredDark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo-rag.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QUERY MIND — Grounded Coding Assistant</title>
    <meta name="description" content="AI-powered coding assistant with Qdrant vector search, TF-IDF lexical retrieval, DuckDuckGo web search fallback, and Ollama LLM generation." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
